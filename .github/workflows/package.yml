name: package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: unsigned iOS package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA and simulator app
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            ${{ runner.temp }}/dist/*.ipa
            ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew :core:test :app:assembleRelease --stacktrace && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
