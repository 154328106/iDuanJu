name: player regression
on:
  workflow_dispatch:
  push:
    branches: [codex/player-pip-recovery]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
          key: ${{ runner.os }}-swift-packages-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: ${{ runner.os }}-swift-packages-
      - name: Test production player and gesture regressions
        run: |
          xcodegen generate
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["name"].startswith("iPhone")))')
          set -o pipefail
          xcodebuild -project STV.xcodeproj -scheme STV -configuration Debug -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath DerivedDataRelease CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:STVTests/PlayerAdjustTests -only-testing:STVTests/PlayerTransportTests -only-testing:STVUITests/PlayerUITests/testLandscapeEpisodePagingAndRotation -only-testing:STVUITests/PlayerUITests/testLandscapeSideAdjustmentsAndLockDoNotChangeEpisode -only-testing:STVUITests/PlayerUITests/testPlayAfterInterruptionWithoutEnd -only-testing:STVUITests/PlayerUITests/testSideAdjustmentsWhileEpisodeIsLoadingOrFailed test 2>&1 | tee "$RUNNER_TEMP/player-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-regression
          path: |
            ${{ runner.temp }}/player-tests.log
            DerivedDataRelease/Logs/Test/*.xcresult
