name: novel source validation
on:
  workflow_dispatch:
  push:
    branches: [codex/novel-rank-downloads, codex/novel-fanqie-shuqi-theme]
permissions:
  contents: read
jobs:
  ios-ui:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build and test production novel screens in isolation
        run: |
          python3 scripts/novel-validation/preview.py "$RUNNER_TEMP/novel-preview"
          cd "$RUNNER_TEMP/novel-preview"
          xcodegen generate
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;print(next(d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v if d["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild -project NovelPreview.xcodeproj -scheme STV -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test 2>&1 | tee "$RUNNER_TEMP/novel-build.log"
      - name: Capture actual native ranking layout
        run: |
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$RUNNER_TEMP/novel-preview/build/Build/Products/Debug-iphonesimulator/STV.app"
          xcrun simctl terminate "$SIM" app.iduanju.novelpreview || true
          SIMCTL_CHILD_NOVEL_PREVIEW=1 xcrun simctl launch "$SIM" app.iduanju.novelpreview
          sleep 5
          xcrun simctl io "$SIM" screenshot "$RUNNER_TEMP/novel-rank-preview.png"
          for ROUTE in detail download; do
            xcrun simctl terminate "$SIM" app.iduanju.novelpreview
            SIMCTL_CHILD_NOVEL_PREVIEW=1 SIMCTL_CHILD_NOVEL_ROUTE="$ROUTE" xcrun simctl launch "$SIM" app.iduanju.novelpreview
            sleep 3
            xcrun simctl io "$SIM" screenshot "$RUNNER_TEMP/novel-$ROUTE-preview.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-native-verification
          path: |
            ${{ runner.temp }}/novel-build.log
            ${{ runner.temp }}/novel-*-preview.png
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :core:test :app:assembleDebug --console=plain
        working-directory: android
  sources:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual Legado rule engine
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/novel-check"
          python3 scripts/novel-validation/prepare.py "$D"
          swift build --package-path Packages/QuickJS -c debug
          BIN=$(swift build --package-path Packages/QuickJS -c debug --show-bin-path)
          swiftc -swift-version 5 -I "$BIN/CQuickJS.build" -Xcc -I/usr/include/libxml2 \
            -I "$(xcrun --show-sdk-path)/usr/include/libxml2" -lxml2 \
            "$D"/*.swift scripts/novel-validation/Runner.swift "$BIN"/CQuickJS.build/*.o \
            -o "$RUNNER_TEMP/novel-runner"
      - name: Test requested collection with production engine
        run: python3 scripts/novel-validation/run.py "$RUNNER_TEMP/novel-runner" "$RUNNER_TEMP/novel-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novel-source-report
          path: ${{ runner.temp }}/novel-results/report.json
          if-no-files-found: ignore
